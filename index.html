<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>TLauncher</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* ===== MENU ===== */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
}
.logo-text{
    font-size:26px;
    font-weight:800;
    color:#7CFC00;
}
nav ul{
    list-style:none;
    display:flex;
    gap:40px;
    font-weight:600;
}
nav a{
    color:white;
    text-decoration:none;
    transition:.3s;
    position:relative;
}
nav a:hover{ color:#00ff88; }

/* ACTIVE MENU */
nav a.active{
    color:#00ff88;
}
nav a.active::after{
    content:"";
    position:absolute;
    bottom:-6px;
    left:0;
    width:100%;
    height:3px;
    background:#00ff88;
    border-radius:3px;
}

/* HERO */
.hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-top:80px;
}
.creeper{
    width:130px;
    height:130px;
    background:#3cb043;
    position:relative;
    border-radius:12px;
    box-shadow:0 0 35px #00ff00;
    margin-bottom:25px;
}
.eye{width:28px;height:28px;background:black;position:absolute;top:28px;}
.eye.left{left:22px;}
.eye.right{right:22px;}
.mouth{width:55px;height:45px;background:black;position:absolute;bottom:22px;left:37px;}

h1{font-size:56px;font-weight:800;margin:10px 0;}
p{font-size:20px;max-width:700px;color:#c8ffc8;}

.buttons{margin-top:30px;display:flex;gap:20px;}

.btn{
    padding:15px 35px;
    border-radius:30px;
    font-weight:700;
    font-size:16px;
    border:none;
    cursor:pointer;
    transition: all .35s cubic-bezier(.25,.8,.25,1);
}
.btn-main{background:#00ff88;color:black;text-decoration:none;}
.btn-dark{background:#222;color:white;}
.btn:hover{transform:scale(1.08);}
.btn:active{transform:scale(.95);}

/* ===== MODAL HỖ TRỢ ===== */
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}
.modal-box{
    background:white;
    color:black;
    padding:30px;
    border-radius:12px;
    width:320px;
    text-align:center;
    position:relative;
}
.close{
    position:absolute;
    top:8px;
    right:12px;
    font-size:20px;
    cursor:pointer;
    color:red;
}
</style>
</head>

<body>

<nav>
    <div class="logo-text">TLAUNCHER</div>
    <ul>
        <li><a href="https://www.mediafire.com/file/tk0xlxihdcretbs/TLauncher-Installer-1.9.5.5.exe/file" target="_blank">Tải về</a></li>
        <li><a href="#community">Cộng đồng</a></li>
        <li><a href="#" id="supportBtn">Hỗ trợ</a></li>
    </ul>
</nav>

<div class="hero">
    <div class="creeper">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <h1>CHÀO MỪNG ĐẾN TLAUNCHER</h1>
    <p>Minecraft là thế giới lý tưởng để sáng tạo, sinh tồn và khám phá cùng bạn bè.</p>

    <div class="buttons">
        <a href="https://www.mediafire.com/file/tk0xlxihdcretbs/TLauncher-Installer-1.9.5.5.exe/file" target="_blank" class="btn btn-main">Tải TLauncher</a>
        <button class="btn btn-dark" onclick="copyPhone()">Liên hệ</button>
    </div>
</div>

<!-- MODAL -->
<div class="modal" id="supportModal">
  <div class="modal-box">
    <div class="close" onclick="closeModal()">✖</div>
    <h2>HỖ TRỢ CON CAK</h2>
</div>
<script>
// MENU ACTIVE
const links = document.querySelectorAll("nav a");
links.forEach(link=>{
  link.addEventListener("click",function(){
    links.forEach(l=>l.classList.remove("active"));
    this.classList.add("active");
  });
});

// COPY PHONE
function copyPhone(){
    navigator.clipboard.writeText("0775029238");
    alert("Đã copy số điện thoại");
}

// MODAL
document.getElementById("supportBtn").onclick = function(){
    document.getElementById("supportModal").style.display="flex";
}
function closeModal(){
    document.getElementById("supportModal").style.display="none";
}
</script>

</body>
</html>
